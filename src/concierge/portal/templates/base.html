<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Propose a talk{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5f2; --surface: #ffffff; --text: #1f1d1a; --muted: #6b665e; --border: #e4dfd7;
      --accent: #c2410c; --accent-soft: #fdeee6; --accent-text: #9a3412;
      --green: #15803d; --green-soft: #e3f4e8;
      --blue: #1d4ed8; --blue-soft: #e5ecfd;
      --rose: #9f1239; --rose-soft: #fbe7ec;
      --amber: #a16207; --amber-soft: #fbf1d9;
      --error: #b00020; --error-soft: #fde8eb;
      --shadow: 0 1px 2px #0000000d, 0 2px 8px #0000000a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171512; --surface: #221f1b; --text: #f1ede7; --muted: #a8a197; --border: #39342d;
        --accent: #f97316; --accent-soft: #3a2316; --accent-text: #fdba74;
        --green: #4ade80; --green-soft: #163322;
        --blue: #93b4fd; --blue-soft: #1a2540;
        --rose: #fda4b8; --rose-soft: #3b1a23;
        --amber: #fcd34d; --amber-soft: #382c12;
        --error: #ff8a9a; --error-soft: #3d1a20;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: var(--accent-text); }
    header.site { background: linear-gradient(120deg, #9a3412, #c2410c 45%, #db2777); color: #fff; }
    header.site .inner { max-width: var(--page, 36rem); margin: 0 auto; padding: .9rem 1rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center; }
    header.site .brand { font-weight: 700; letter-spacing: .01em; margin-right: auto; }
    header.site nav { display: flex; gap: .25rem; }
    header.site nav a { color: #fff; text-decoration: none; padding: .3rem .7rem; border-radius: 99px; font-size: .95rem; }
    header.site nav a:hover { background: #ffffff26; }
    header.site nav a[aria-current="page"] { background: #ffffff33; font-weight: 600; }
    main { max-width: var(--page, 36rem); margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: .5rem 0 .25rem; }
    .lede { color: var(--muted); margin-top: 0; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem 1.1rem; box-shadow: var(--shadow); margin-top: 1rem; }
    label, .label { display: block; margin-top: 1rem; font-weight: 600; }
    .hint { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
    input[type=email], input[type=text], select, textarea { width: 100%; padding: .6rem .7rem; font: inherit; margin-top: .3rem; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: .5rem; }
    textarea { min-height: 9rem; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input:user-invalid, textarea:user-invalid { border-color: var(--error); }
    .check { display: flex; gap: .6rem; align-items: flex-start; font-weight: 600; cursor: pointer; }
    .check input { width: 1.15rem; height: 1.15rem; margin: .2rem 0 0; accent-color: var(--accent); flex: none; }
    .counter { text-align: right; font-size: .8rem; color: var(--muted); margin-top: .2rem; }
    .counter.over { color: var(--error); font-weight: 600; }
    button, .button { display: inline-block; margin-top: 1.25rem; padding: .75rem 1.3rem; font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: .55rem; cursor: pointer; text-decoration: none; }
    button:hover, .button:hover { filter: brightness(1.08); }
    button[disabled] { opacity: .6; cursor: progress; }
    .button.secondary { background: transparent; color: var(--accent-text); border: 1px solid var(--border); }
    .error { color: var(--error); background: var(--error-soft); border-radius: .5rem; padding: .6rem .8rem; font-weight: 600; }
    .muted { color: var(--muted); font-size: .9rem; }
    .pill { display: inline-block; padding: .05rem .55rem; border-radius: 99px; border: 1px solid var(--border); font-size: .78rem; white-space: nowrap; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: .6rem; padding: .75rem 1rem; margin-top: 1rem; }
    [hidden] { display: none !important; }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="site">
    <div class="inner">
      <span class="brand">{{ catalog.event.name if catalog else "AI Meetup" }}</span>
      <nav>
        <a href="{{ url_for('index') }}"{% if request.url.path == url_for('index').path %} aria-current="page"{% endif %}>Propose a talk</a>
        <a href="{{ url_for('board') }}"{% if request.url.path == url_for('board').path %} aria-current="page"{% endif %}>Proposal board</a>
      </nav>
    </div>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>

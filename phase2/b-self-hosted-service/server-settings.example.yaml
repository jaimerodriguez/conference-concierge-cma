# Guide 21 · Migrating to self-hosted Managed Agents · Step 4: server settings to merge
# Merge these keys into your server's settings file (compose.config.yaml in the quickstart
# stack), then restart the server. Key names are from the "Differences from hosted" page;
# the operator-guide.md inside your release archive is the authority for your version.

mcp:
  # Empty by default. Matching is exact: no wildcards, no subdomains. URLs must be https.
  allowed_hostnames:
    - coco.agenticpraxis.ai
  # Only when the name resolves to a private address (10/8, 172.16/12, 192.168/16):
  # private_hostnames:
  #   - concierge.internal.example.com

# The demo's agents turn web_search and web_fetch off, so leave web tools disabled.
# web_tools:
#   enabled: false

# Guide 01 · Declaring an agent and applying it with the CLI · Step 2: declare the environment
# The environment is the sandbox template every session's container starts from.
name: concierge-cloud
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: false
    allow_mcp_servers: true
    # Guide 06 · Storing secrets in a vault · Step 4: the sandbox may only call hosts listed here.
    # `concierge setup host <your-tunnel-host>` rewrites this placeholder everywhere in managed/.
    allowed_hosts: [coco.agenticpraxis.ai]
